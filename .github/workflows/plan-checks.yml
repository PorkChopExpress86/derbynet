name: plan-checks

# Checks the Django migration's planning records: the paths the ADRs cite, and
# every django-migration issue body (plan/lint-issues.py).
#
# The issue lint reads live GitHub state, not the checkout, so a pull request
# runs it only when it changes plan/; otherwise one stale issue would fail every
# open pull request.  Issue events, pushes to master and a daily run catch the
# drift instead: a merged pull request that closes, or fails to close, an issue
# shows up as a push and a `closed` event.

on:
  push:
    branches: [master]
  pull_request:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: plan-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan-checks:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'django-migration')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The lint counts a PR GitHub shows as closed as merged when its head
          # commit is on origin/master, so it needs the history.
          fetch-depth: 0

      - name: Check the paths the ADRs cite
        if: github.event_name != 'issues'
        run: bash server/docs/adr/check-paths.sh

      - name: Decide whether to lint the issues
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] ||
             ! git diff --quiet "$BASE" HEAD -- plan/; then
            echo lint=true >> "$GITHUB_OUTPUT"
          else
            echo "No change under plan/; the issue lint runs on master and on issue events."
          fi

      - name: Lint the plan's issue bodies
        if: steps.scope.outputs.lint == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I plan/lint-issues.py --repo "${{ github.repository }}"
