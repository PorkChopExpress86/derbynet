name: parity

# The parity gate (#37): the shell suite of testing/, in the order
# testing/exercise-one-database.sh runs it, against the PHP server and against
# the Django server on SQLite and on Postgres, each leg from its own copy of
# testing/.  server/tools/parity_gate.py then compares each step's transcript
# with PHP's, after the registry's allowlist (PARITY_PATHS in
# server/legacy_api/registry.py), and fails on a failed step or any other
# difference.  Each Django leg also replays the golden fixtures of #7 and
# races a round with derby-timer.jar (#32), as server.yml does.
#
# The Django server runs as in server.yml, with runserver and the test
# endpoints on; there is no Django image yet (#58).  Both legs run the suite
# from the test harness image of testing/docker/run-suite.sh, so they use the
# same curl, jq and xmllint.
#
# The gate can't pass until the tickets in WAITING (server/tools/parity_gate.py)
# land, so it runs nightly, on demand, and on a push to a branch named
# parity-check/<anything>.  The track job keeps one issue on this fork that
# lists the failing steps (#218).  It does not run on pull requests: a red gate would
# stop plan/bin/pr-merge, which merges only when every check passed.  To try a
# change to the gate, push its commit to parity-check/<name> as well.

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
  push:
    branches: ['parity-check/**']

# Every job reads only; the track job alone writes issues.
permissions:
  contents: read

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: leg (php)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # testing/docker/run-suite.sh harness, with its layers cached between
      # runs, as in php-suite.yml.
      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build the test harness image
        uses: docker/build-push-action@v7.4.0
        with:
          context: testing/puppeteer
          file: testing/docker/Dockerfile
          tags: derbynet-test-harness
          load: true
          cache-from: type=gha,scope=harness
          cache-to: type=gha,scope=harness,mode=max

      - name: Build PHP assets
        run: testing/docker/run-suite.sh assets

      - name: Build and start the server image
        run: testing/docker/run-suite.sh server

      - name: Raise PHP and nginx timeouts
        run: testing/docker/run-suite.sh timeout

      # PHP's SQLite tables reuse the id of a deleted last row, and Django's
      # never do (ADR-12), so ids would part between the legs; the php-suite
      # job's second run does the same.
      - name: Make the SQLite tables never reuse an ID
        run: testing/docker/run-suite.sh autoincrement

      # A failed step doesn't end the leg; the gate job judges it.
      - name: Run the suite, step by step
        env:
          DERBYNET_PARITY_DIR: ${{ runner.temp }}/leg
        run: testing/docker/run-suite.sh parity

      - name: Collect the server log
        if: always()
        run: testing/docker/run-suite.sh logs > "$RUNNER_TEMP/leg/steps/server.log" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: leg-php
          path: ${{ runner.temp }}/leg/steps
          if-no-files-found: error

      - name: Remove the server container
        if: always()
        run: testing/docker/run-suite.sh clean

  django:
    name: leg (django, ${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            url: ''
          - database: postgres
            url: postgres://postgres:postgres@localhost:5432/derbynet
    services:
      postgres:
        # An empty image skips the service on the SQLite run.
        image: ${{ matrix.database == 'postgres' && 'postgres:17' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: derbynet
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: ${{ matrix.url }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.14'

      - name: Install dependencies
        working-directory: server
        run: uv sync --locked

      # testing/docker/run-suite.sh harness, with its layers cached between
      # runs, as in php-suite.yml.
      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build the test harness image
        uses: docker/build-push-action@v7.4.0
        with:
          context: testing/puppeteer
          file: testing/docker/Dockerfile
          tags: derbynet-test-harness
          load: true
          cache-from: type=gha,scope=harness
          cache-to: type=gha,scope=harness,mode=max

      # runserver with DERBYNET_ENABLE_TEST_ENDPOINTS=1 and DERBYNET_BACKEND=django.
      # The data folder is the PHP image's, so that the folder settings differ
      # only where D57 says.
      - name: Run the suite, step by step
        env:
          DERBYNET_PARITY_DATA_DIR: /var/lib/derbynet
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" /var/lib/derbynet
          server/tools/parity-django.sh "$RUNNER_TEMP/leg" 8080

      - name: Keep the server log with the steps
        if: always()
        run: cp "$RUNNER_TEMP/leg/server.log" "$RUNNER_TEMP/leg/suite/steps/" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: leg-django-${{ matrix.database }}
          path: ${{ runner.temp }}/leg/suite/steps
          if-no-files-found: error

      # The PHP golden fixtures of #7 (engine outputs, timer transcripts, poll
      # payloads), replayed against Django on this leg's database engine:
      # every test the root conftest.py marks `golden`.
      - name: Replay the golden fixtures against Django
        if: ${{ !cancelled() }}
        working-directory: server
        run: uv run pytest -rs -m 'golden and not full'

      # The real derby-timer.jar, with its simulated timer, races a whole round
      # (#32, ADR-02), as server.yml runs it.  The runner image ships Java and
      # Ant.  The suite's server has stopped, so this starts another on the
      # same data folder; race-with-derby-timer.sh starts from an empty
      # database.
      - name: Race a round with derby-timer.jar against Django
        if: ${{ !cancelled() }}
        env:
          DERBYNET_ENABLE_TEST_ENDPOINTS: '1'
          DERBYNET_DATA_DIR: /var/lib/derbynet
          DERBYNET_CONFIG_DIR: ${{ runner.temp }}/leg/config
        run: |
          command -v xmllint >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libxml2-utils
          }
          ant -noinput -buildfile timer/build.xml
          (cd server && uv run python manage.py runserver 127.0.0.1:8080 --noreload \
            > "$RUNNER_TEMP/timer-server.log" 2>&1 &)
          for _ in $(seq 60); do
            curl -sf -o /dev/null http://127.0.0.1:8080/health/ && break
            sleep 1
          done
          bash testing/race-with-derby-timer.sh http://127.0.0.1:8080

      - name: Show the derby-timer.jar and server logs
        if: failure()
        run: |
          cat testing/derby-timer.log || true
          cat "$RUNNER_TEMP/timer-server.log" || true

  gate:
    name: gate (django, ${{ matrix.database }})
    needs: [php, django]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: uv sync --locked

      - uses: actions/download-artifact@v8
        with:
          name: leg-php
          path: ${{ runner.temp }}/php

      - uses: actions/download-artifact@v8
        with:
          name: leg-django-${{ matrix.database }}
          path: ${{ runner.temp }}/django

      - name: Compare the legs
        run: >-
          uv run python -m tools.parity_gate
          --labels php,django-${{ matrix.database }}
          --summary "$GITHUB_STEP_SUMMARY"
          --failing "$RUNNER_TEMP/failing-${{ matrix.database }}.json"
          "$RUNNER_TEMP/php" "$RUNNER_TEMP/django"

      # The failing steps, for the track job, whatever the comparison said.
      # A job that died before writing them uploads nothing, and the track
      # job records that leg as one that did not report.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: failing-${{ matrix.database }}
          path: ${{ runner.temp }}/failing-${{ matrix.database }}.json
          if-no-files-found: warn

  # One issue on this fork lists the steps failing the gate, and changes when
  # that list does (#218): server/tools/parity_tracking.py.  Every gh call it
  # makes names --repo PorkChopExpress86/derbynet, never upstream.  Only a run
  # on master writes to the issue; a run on any other branch, or in another
  # repository, is a dry run that prints what it would do.
  track:
    name: track the failing steps
    needs: gate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.14'

      # With no artifact at all the download fails; the step goes on, and
      # parity_tracking.py records each missing file.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: failing-*
          merge-multiple: true
          path: ${{ runner.temp }}/failing

      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: >-
            ${{ (github.repository != 'PorkChopExpress86/derbynet'
                 || github.ref != 'refs/heads/master') && '--dry-run' || '' }}
        run: >-
          uv run --no-project python -m tools.parity_tracking $DRY_RUN
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --sha "$GITHUB_SHA"
          --workdir "$RUNNER_TEMP"
          sqlite="$RUNNER_TEMP/failing/failing-sqlite.json"
          postgres="$RUNNER_TEMP/failing/failing-postgres.json"
