name: php-suite

# Runs the shell test suite in testing/ against the PHP server image built from
# this commit.  Every step is a step of testing/docker/run-suite.sh (the harness
# build through build-push-action, for its layer cache), so a developer can run
# the same thing locally; see testing/README.md.
#
# The suite runs twice.  The second run makes the server's SQLite tables never
# reuse an ID and shifts the IDs that the database hands out, as Django's would,
# so a test that depends on an ID fails there.

# The PHP server under website/ is frozen, so a pull request runs the suite
# only when it changes the suite or what the image is built from.  A push to
# master runs it whatever changed, which catches a path missing from this list.
on:
  push:
    branches: [master]
  pull_request:
    paths:
      - website/**
      - testing/**
      - installer/docker/**
      - templates/**
      - timer/**
      - build.xml
      - .github/workflows/php-suite.yml
  workflow_dispatch:

concurrency:
  group: php-suite-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  php-suite:
    name: php-suite (${{ matrix.ids }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - ids: fresh IDs
            shift: ''
          - ids: shifted IDs
            shift: '1'
    env:
      DERBYNET_SHIFT_IDS: ${{ matrix.shift }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tests for literal IDs
        run: testing/check-no-literal-ids.sh

      # testing/docker/run-suite.sh harness, with its layers cached between
      # runs.  A pull request reads the cache that master's runs write.
      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build test harness image
        uses: docker/build-push-action@v7.4.0
        with:
          context: testing/puppeteer
          file: testing/docker/Dockerfile
          tags: derbynet-test-harness
          load: true
          cache-from: type=gha,scope=harness
          cache-to: type=gha,scope=harness,mode=max

      - name: Build PHP assets
        run: testing/docker/run-suite.sh assets

      - name: Build and start the server image
        run: testing/docker/run-suite.sh server

      - name: Raise PHP and nginx timeouts
        run: testing/docker/run-suite.sh timeout

      - name: Make the SQLite tables never reuse an ID
        if: matrix.shift != ''
        run: testing/docker/run-suite.sh autoincrement

      - name: Run the test suite
        run: testing/docker/run-suite.sh suite

      - name: Collect server log
        if: failure()
        run: testing/docker/run-suite.sh logs > testing/server.log || true

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: suite-output-${{ matrix.shift == '' && 'fresh-ids' || 'shifted-ids' }}
          path: |
            testing/output.curl
            testing/debug.curl
            testing/suite.log
            testing/server.log
          if-no-files-found: ignore

      - name: Remove server container
        if: always()
        run: testing/docker/run-suite.sh clean
