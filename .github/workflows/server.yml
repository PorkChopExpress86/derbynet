name: server

# Lints and tests the Django server in server/ on Python 3.14, once on SQLite
# and once on Postgres (owner decision D1).  See server/README.md.

on:
  push:
    branches: [master]
    paths:
      - server/**
      - website/inc/generators/**
      - .github/workflows/server.yml
  pull_request:
    paths:
      - server/**
      - website/inc/generators/**
      - .github/workflows/server.yml
  workflow_dispatch:

concurrency:
  group: server-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    name: server (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            url: ''
          - database: postgres
            url: postgres://postgres:postgres@localhost:5432/derbynet
    services:
      postgres:
        # An empty image skips the service on the SQLite run.
        image: ${{ matrix.database == 'postgres' && 'postgres:17' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
          # The shell-suite step connects to this database, not to the
          # test_derbynet one that pytest creates.
          POSTGRES_DB: derbynet
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: ${{ matrix.url }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Check the generator tables match website/inc/generators
        run: uv run python tools/convert_generators.py --check

      - name: Check deviations.json is in the order the tool writes
        run: uv run python tools/reschedule_deviations.py --check

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Test
        run: uv run pytest -v -rs

      - name: Test the legacy API with the test endpoints on
        env:
          DERBYNET_ENABLE_TEST_ENDPOINTS: '1'
        run: uv run pytest -v -rs legacy_api

      # testing/reset-database.sh runs before every phase of the shell suites,
      # so it is the first thing that must pass against Django (#63).  The test
      # endpoints are on, as the suites need (test.setup, anonymous
      # database.check).
      - name: Run testing/reset-database.sh against Django
        env:
          DERBYNET_ENABLE_TEST_ENDPOINTS: '1'
          DERBYNET_DATA_DIR: ${{ runner.temp }}/data
          DERBYNET_CONFIG_DIR: ${{ runner.temp }}/config
        run: |
          command -v xmllint >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libxml2-utils
          }
          mkdir -p "$DERBYNET_DATA_DIR" "$DERBYNET_CONFIG_DIR"
          uv run python manage.py migrate
          uv run python manage.py create_test_event
          uv run python manage.py runserver 127.0.0.1:8080 --noreload \
            > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 30); do
            curl -sf 'http://127.0.0.1:8080/action.php?query=role.list' >/dev/null && break
            sleep 1
          done
          cd ../testing
          # Twice in a row, then with database.check before every POST.
          bash reset-database.sh http://127.0.0.1:8080
          bash reset-database.sh http://127.0.0.1:8080
          DBCHECK=1 bash reset-database.sh http://127.0.0.1:8080

      # The racer and check-in suites of #29, in the order
      # testing/exercise-one-database.sh runs them, as far as Django serves
      # them: import-roster.sh, test-den-changes.sh (#30), then
      # test-basic-checkins.sh, which test-basic-racing.sh starts with.  They
      # run from the repository root, where testing/common.sh keeps its
      # scratch files.  test-racer-query.sh needs test-basic-racing.sh and
      # test-awards.sh (#33), and later suites that #34 and #36 serve, first.
      - name: Run the racer and check-in suites against Django
        working-directory: .
        run: |
          bash testing/reset-database.sh http://127.0.0.1:8080
          bash testing/import-roster.sh http://127.0.0.1:8080
          bash testing/test-den-changes.sh http://127.0.0.1:8080
          bash testing/test-basic-checkins.sh http://127.0.0.1:8080
          bash testing/reset-database.sh http://127.0.0.1:8080
          bash testing/import-csv-roster.sh http://127.0.0.1:8080 testing/data/outlaw-class.csv
          DBCHECK=1 bash testing/import-csv-roster.sh http://127.0.0.1:8080 testing/data/outlaw-class.csv

      # The race-control and poll suites of #31 that need no endpoint of
      # another ticket, in testing/exercise-one-database.sh order.
      - name: Run the race-control suites against Django
        working-directory: .
        run: |
          bash testing/reset-database.sh http://127.0.0.1:8080
          bash testing/test-car-numbers.sh http://127.0.0.1:8080
          bash testing/test-extended-scheduling.sh http://127.0.0.1:8080
          bash testing/test-rotation-schedule.sh http://127.0.0.1:8080
          bash testing/test-model-a-club.sh http://127.0.0.1:8080
          bash testing/reset-database.sh http://127.0.0.1:8080
          bash testing/test-partitions.sh http://127.0.0.1:8080
          bash testing/test-racing-groups.sh http://127.0.0.1:8080
          bash testing/reset-database.sh http://127.0.0.1:8080
          bash testing/import-roster.sh http://127.0.0.1:8080
          bash testing/test-den-changes.sh http://127.0.0.1:8080
          bash testing/test-unused-lanes.sh http://127.0.0.1:8080

      # The suites that race heats through timer-message (#32) with run_heat
      # and need no endpoint of another ticket.  The others read replay (#34)
      # or export-json.php (#36), so they wait for those tickets.
      - name: Run the timer-message suites against Django
        working-directory: .
        run: |
          bash testing/reset-database.sh http://127.0.0.1:8080
          bash testing/import-roster.sh http://127.0.0.1:8080
          bash testing/test-den-changes.sh http://127.0.0.1:8080
          bash testing/test-master-schedule.sh http://127.0.0.1:8080
          bash testing/test-aggregate-rounds.sh http://127.0.0.1:8080
          bash testing/test-aggregate-nonracing.sh http://127.0.0.1:8080

      # The award suite (#33) after the master schedule, in
      # testing/exercise-one-database.sh order.  `test-awards.sh basic` follows
      # test-basic-racing.sh, which posts replay.message (#34), so it waits.
      - name: Run the award suite against Django
        working-directory: .
        run: |
          bash testing/reset-database.sh http://127.0.0.1:8080
          bash testing/import-roster.sh http://127.0.0.1:8080
          bash testing/test-den-changes.sh http://127.0.0.1:8080
          bash testing/test-master-schedule.sh http://127.0.0.1:8080
          bash testing/test-awards.sh http://127.0.0.1:8080 master

      # The standings suites read their rows from export-json.php (#36). The
      # points racing suite checks the points in the middle of a round only in
      # test_points_rerun.py, since no server writes a sheet for a round that
      # is not finished.
      - name: Run the standings suites against Django
        working-directory: .
        run: |
          bash testing/reset-database.sh http://127.0.0.1:8080
          bash testing/import-roster.sh http://127.0.0.1:8080
          bash testing/test-den-changes.sh http://127.0.0.1:8080
          bash testing/test-standing-by-rank.sh http://127.0.0.1:8080
          bash testing/reset-database.sh http://127.0.0.1:8080
          bash testing/import-roster.sh http://127.0.0.1:8080
          bash testing/test-den-changes.sh http://127.0.0.1:8080
          bash testing/test-aggregate-classes.sh http://127.0.0.1:8080
          bash testing/reset-database.sh http://127.0.0.1:8080
          bash testing/test-points-racing.sh http://127.0.0.1:8080

      # test-preferences.sh waits for #34: it sets `racing_scene = 4`, and the
      # scenes of a reset database have new ids (the rest of it passes).
      - name: Run the subgroup trophy suite against Django
        working-directory: .
        run: |
          bash testing/reset-database.sh http://127.0.0.1:8080
          bash testing/test-subgroup-ntrophies.sh http://127.0.0.1:8080

      - name: Run the result import suite against Django
        working-directory: .
        run: |
          bash testing/reset-database.sh http://127.0.0.1:8080
          bash testing/test-import-results.sh http://127.0.0.1:8080

      # snapshot.get, then snapshot.put as nobody (refused) and as the
      # coordinator, the way testing/exercise-one-database.sh ends.
      - name: Round-trip a snapshot against Django
        working-directory: .
        run: |
          bash testing/snapshot-round-trip.sh http://127.0.0.1:8080

      # A suite that writes into its working directory leaves a file a later
      # `git add -A` commits.  Write to $TMPDIR instead.
      - name: Check the shell suites left the checkout clean
        working-directory: .
        run: |
          status="$(git status --porcelain)"
          [ -z "$status" ] || { echo "$status"; exit 1; }

      # The real derby-timer.jar, with its simulated timer, races a whole
      # round, as timer/testing/fake-timer runs it (#32, ADR-02).  The runner
      # image ships Java and Ant.
      - name: Race a round with derby-timer.jar against Django
        working-directory: .
        run: |
          ant -noinput -buildfile timer/build.xml
          bash testing/race-with-derby-timer.sh http://127.0.0.1:8080

      - name: Show the derby-timer.jar log
        if: failure()
        run: cat ../testing/derby-timer.log || true

      - name: Show the Django server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log"
