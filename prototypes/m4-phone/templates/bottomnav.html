<nav data-chrome aria-label="Primary" class="fixed inset-x-0 bottom-0 z-30 border-t border-line bg-surface pb-[env(safe-area-inset-bottom)]">
  <ul class="grid grid-cols-4">
    {% for item in nav %}<li>
      {% if item.more %}
      <button type="button" aria-haspopup="dialog" @click="$store.ui.open('more', $event)" class="flex h-16 w-full flex-col items-center justify-center gap-0.5 text-xs font-medium text-ink-muted">
        <span class="grid h-7 w-14 place-items-center rounded-full">{% include "icon.html" with name=item.icon %}</span>{{ item.label }}
      </button>
      {% else %}
      <a href="{{ item.href }}"{% if item.key == active %} aria-current="page"{% endif %} class="flex h-16 w-full flex-col items-center justify-center gap-0.5 text-xs font-medium {% if item.key == active %}text-ink{% else %}text-ink-muted{% endif %}">
        <span class="grid h-7 w-14 place-items-center rounded-full{% if item.key == active %} bg-accent-soft{% endif %}">{% include "icon.html" with name=item.icon %}</span>{{ item.label }}
      </a>
      {% endif %}
    </li>{% endfor %}
  </ul>
</nav>
