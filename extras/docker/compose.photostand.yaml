# The photo stand on a Raspberry Pi (#59): photostand.sh in the photo stand
# image, started again whenever Docker starts, so after the Pi boots too.
# docs/pi-setup.md walks through it.  Put the settings in a file named .env
# beside this one; each is the /etc/derbynet.conf setting of the same name
# (docs/photo-stand.md), and one left empty keeps photostand.sh's default.
# Put each value in single quotes, so Compose keeps a $ or a ' #' in it as
# typed (docs/pi-setup.md, "The settings file"):
#
#   DERBYNET_SERVER=http://192.168.1.20      the server's address, no slash at the end
#   PHOTO_CAPTURE=gphoto2                    or fswebcam, or chdkptp
#   PHOTO_REPO=car                           or head
#   PHOTO_CHECKIN=0                          1 also checks each racer in
#   AUTOCROP=0                               1 crops each photo to the face
#   PHOTO_USER=Photo
#   PHOTO_PASSWORD='flashbulb'
#   BARCODE_SCANNER_DEVS=                    the scanner's name under /dev/input/by-id
#   FSWEBCAM_ARGS=
#   DERBYNET_INPUT_DIR=/dev/input            the folder of input devices the scanner is in (the default)
#   DERBYNET_PHOTOSTAND_IMAGE=...            another image, such as a test release's tag
#
# then run `docker compose -f compose.photostand.yaml up -d`.

services:
  photostand:
    image: ${DERBYNET_PHOTOSTAND_IMAGE:-ghcr.io/porkchopexpress86/derbynet_photostand:latest}
    restart: unless-stopped
    environment:
      DERBYNET_SERVER: ${DERBYNET_SERVER:?set DERBYNET_SERVER in .env to the server's address}
      PHOTO_CAPTURE: ${PHOTO_CAPTURE:-}
      PHOTO_REPO: ${PHOTO_REPO:-}
      PHOTO_CHECKIN: ${PHOTO_CHECKIN:-}
      AUTOCROP: ${AUTOCROP:-}
      PHOTO_USER: ${PHOTO_USER:-}
      PHOTO_PASSWORD: ${PHOTO_PASSWORD:-}
      BARCODE_SCANNER_DEVS: ${BARCODE_SCANNER_DEVS:-}
      FSWEBCAM_ARGS: ${FSWEBCAM_ARGS:-}
    # The scanner (/dev/input), a USB camera (/dev/bus/usb) and the sound card
    # (/dev/snd) come in as folders, with the device numbers they use allowed,
    # so a scanner or camera plugged in after the start still works: 13 is
    # input, 189 USB and 116 sound.
    volumes:
      - ${DERBYNET_INPUT_DIR:-/dev/input}:/dev/input:ro
      - /dev/bus/usb:/dev/bus/usb
      - /dev/snd:/dev/snd
      - photostand-photos:/var/lib/derbynet-photostand
      # A CHDK camera: chdkptp is not in the image.  Unpack an arm64 build
      # of chdkptp into a chdkptp folder beside this file, then remove the #.
      # - ./chdkptp:/opt/chdkptp:ro
    device_cgroup_rules:
      - 'c 13:* rmw'
      - 'c 189:* rmw'
      - 'c 116:* rmw'
    # A webcam: remove the # on these two lines.
    # devices:
    #   - /dev/video0:/dev/video0

volumes:
  photostand-photos:
