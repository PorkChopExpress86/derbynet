# The timer on a Raspberry Pi (#59): derby-timer.jar in the timer image,
# started again whenever Docker starts, so after the Pi boots too.
# docs/pi-setup.md walks through it.  Put the settings in a file named .env
# beside this one:
#
#   DERBYNET_SERVER=http://192.168.1.20      the server's address, no slash at the end
#   DERBYNET_TIMER_DEVICE=/dev/ttyUSB0       the timer's serial port on the Pi (the default)
#   TIMER_PASSWORD=                          the Timer role's password, if it has one
#   TIMER_ARGS=                              more derby-timer.jar options, such as -d FastTrackPSeries
#
# Put each value in single quotes, so Compose keeps a $ or a ' #' in it as
# typed (docs/pi-setup.md, "The settings file").
#   DERBYNET_TIMER_IMAGE=...                 another image, such as a test release's tag
#
# then run `docker compose -f compose.timer.yaml up -d`.

services:
  timer:
    image: ${DERBYNET_TIMER_IMAGE:-ghcr.io/porkchopexpress86/derbynet_timer:latest}
    restart: unless-stopped
    environment:
      DERBYNET_SERVER: ${DERBYNET_SERVER:?set DERBYNET_SERVER in .env to the server's address}
      TIMER_PASSWORD: ${TIMER_PASSWORD:-}
      TIMER_ARGS: ${TIMER_ARGS:-}
    # The timer's port is /dev/ttyUSB0 inside, whatever its name on the Pi,
    # and the jar finds it by scanning the serial ports it sees.  Docker
    # passes the port in when the container starts, so the timer must be
    # plugged in then.
    devices:
      - ${DERBYNET_TIMER_DEVICE:-/dev/ttyUSB0}:/dev/ttyUSB0
    volumes:
      - timer-logs:/var/lib/derbynet-timer

volumes:
  timer-logs:
