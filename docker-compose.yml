version: "3.9"

services:
  derbynet:
    build: .
    image: derbynet:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      DERBYNET_CONFIG_DIR: /var/lib/derbynet/config
    volumes:
      - derbynet-data:/var/lib/derbynet
    ports:
      - "${DERBYNET_HTTP_PORT:-8080}:80"
    networks:
      - derbynet

volumes:
  derbynet-data:
    driver: local

networks:
  derbynet:
    driver: bridge
