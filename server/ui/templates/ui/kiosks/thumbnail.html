{# A kiosk page's thumbnail (#46): a static picture of the page type, never the page itself, so it loads fast and changes nothing (scenes.php's live previews cleared the presented award). Pass brief (a built-in page's name) and cls. It is decorative: the page's name is always beside it. #}

{% else %}<rect x="24" y="28" width="112" height="18" rx="3" fill="#f8fafc"/><rect x="44" y="54" width="72" height="7" rx="2" fill="#64748b"/>
