{# The snapshot a purge saved, as a toast with its download link (D78), out of band into #toasts. #}
<div hx-swap-oob="beforeend:#toasts"><div role="status" data-snapshot-toast class="pointer-events-auto flex max-w-md items-center gap-3 rounded-xl bg-surface px-4 py-3 shadow-lg ring-1 ring-line"><span class="min-w-0 flex-1 break-all text-sm">Saved <span class="font-mono">{{ name }}</span></span><a href="{{ url }}" class="font-semibold text-accent underline underline-offset-2" data-snapshot-download>Download</a></div></div>
