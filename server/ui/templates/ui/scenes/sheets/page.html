{% load ui %}{# The page a kiosk name shows in the scene (#46), or none, which takes the name out of the scene. Each page has a thumbnail of that page with no parameters (#237). #}
<div x-data x-init="sceneSheet.show('Page for {{ name|escapejs }}')" data-page-sheet>
  <form hx-post="{% url 'scenes-page' %}" hx-target="#{{ sheet_body }}" hx-swap="innerHTML" hx-include="this" hx-sync="this:drop">
    <input type="hidden" name="scene" value="{{ scene_id }}">
    <input type="hidden" name="name" value="{{ name }}">
    <ul role="list" class="grid grid-cols-2 gap-2 sm:grid-cols-3">
      {% for p in pages %}
      <li>
        <button type="submit" name="page" value="{{ p.full }}" data-page-choice="{{ p.brief }}"{% if p.full == shown %} aria-current="true"{% endif %} class="flex w-full flex-col gap-1 rounded-xl border p-1.5 text-left text-sm font-medium {% if p.full == shown %}border-accent ring-2 ring-accent{% else %}border-line{% endif %}">
          {% kiosk_thumbnail p.full name=name size="choice" %}
          <span class="px-1">{{ p.label }}</span>
        </button>
      </li>
      {% endfor %}
    </ul>
    <button type="submit" name="page" value="" data-page-choice=""{% if not shown %} aria-current="true"{% endif %} class="mt-3 min-h-12 w-full rounded-xl border border-line px-4 font-semibold">No page in this scene</button>
  </form>
</div>
