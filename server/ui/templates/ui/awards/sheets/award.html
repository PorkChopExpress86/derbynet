{# The award sheet (award.edit): name, type without Ad Hoc, the pack, a group or a subgroup, and the partitions it can go to (D35, D38). The partition list follows the group picked. #}
<div x-data x-init="awardsPage.show('{% if award %}Edit {{ award.name|escapejs }}{% else %}New award{% endif %}')" data-award-sheet="{{ award.pk|default:'new' }}">
  <form hx-post="{{ post_url }}" hx-target="#awards-sheet-body" hx-swap="innerHTML" hx-include="this" hx-sync="this:drop" class="flex flex-col gap-4">
    {% if error %}<p role="alert" data-error class="rounded-lg bg-danger-soft px-3 py-2 text-danger-ink">{{ error }}</p>{% endif %}
    <input type="hidden" id="as-award" name="award" value="{{ award.pk|default:'' }}">
    <div>
      <label for="as-name" class="mb-1 block text-sm font-medium">Award name</label>
      <input id="as-name" name="name" value="{{ values.name }}" maxlength="100" required data-autofocus autocomplete="off" class="h-12 w-full rounded-xl border border-field bg-surface px-3 text-base">
    </div>
    <div>
      <label for="as-type" class="mb-1 block text-sm font-medium">Type</label>
      <select id="as-type" name="awardtypeid" class="h-12 w-full rounded-xl border border-field bg-surface px-3 text-base">
        {% for id, name in editor.types %}<option value="{{ id }}"{% if id == values.awardtypeid %} selected{% endif %}>{{ name }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label for="as-scope" class="mb-1 block text-sm font-medium">For</label>
      <select id="as-scope" name="class_and_rank" hx-get="{% url 'awards-editor-partitions' %}" hx-trigger="change" hx-target="#as-partitions" hx-swap="innerHTML" hx-include="#as-scope, #as-award" hx-sync="this:replace" class="h-12 w-full rounded-xl border border-field bg-surface px-3 text-base">
        {% for value, label, indented in editor.scopes %}<option value="{{ value }}"{% if value == values.scope %} selected{% endif %}>{% if indented %}&nbsp;&nbsp;&nbsp;{% endif %}{{ label }}</option>{% endfor %}
      </select>
    </div>
    <div id="as-partitions">{% include "ui/awards/partitions.html" %}</div>
    <div class="flex flex-col gap-2 lg:flex-row-reverse">
      <button type="submit" data-save class="min-h-12 flex-1 rounded-xl bg-accent px-4 font-semibold text-accent-ink">{% if award %}Save{% else %}Add award{% endif %}</button>
      <button type="button" @click="$store.ui.close()" class="min-h-12 flex-1 rounded-xl border border-line px-4 font-semibold">Cancel</button>
    </div>
  </form>
  {% if award %}<button type="button" hx-get="{% url 'awards-editor-delete' award.pk %}" hx-target="#awards-sheet-body" hx-swap="innerHTML" hx-sync="this:replace" data-action="delete" class="mt-4 min-h-12 w-full rounded-xl border border-danger px-4 font-semibold text-danger-ink">Delete award</button>{% endif %}
</div>
