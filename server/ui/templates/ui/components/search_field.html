{# The persistent search field, by name or car number (#39, no barcode scanning, D13). Always on screen, unlike PHP's keypress-only find-racer.js. Pass id, label, name, and hx_get with hx_target to search as the user types. #}
<div class="{{ cls }}">
  <label for="{{ id|default:'find' }}" class="{{ label_class|default:'sr-only' }}">{{ label|default:'Find a racer by name or car number' }}</label>
  <div class="relative">
    <span class="pointer-events-none absolute inset-y-0 left-3 grid place-items-center text-ink-muted">{% include "ui/components/icon.html" with name="search" cls="size-5" %}</span>
    <input id="{{ id|default:'find' }}" name="{{ name|default:'q' }}" type="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="{{ placeholder|default:'Name or car number' }}" value="{{ value|default:'' }}"
      {% if hx_get %}hx-get="{{ hx_get }}" hx-trigger="input changed delay:250ms, search" hx-target="{{ hx_target }}"{% endif %}
      class="h-12 w-full rounded-xl border border-field bg-surface pl-11 pr-3 text-base placeholder:text-ink-muted">
  </div>
</div>
