{# A stepper: a number with large minus and plus buttons (#39). Pass id, name, label, value, min, max. #}
<div x-data="uiStepper({{ value|default:0 }}, {{ min|default:0 }}, {{ max|default:99 }})" class="{{ cls }}">
  <label for="{{ id }}" class="block text-sm font-medium">{{ label }}</label>
  <div class="mt-1 flex items-center gap-2">
    <button type="button" @click="step(-1)" :disabled="value <= {{ min|default:0 }}" aria-label="Fewer: {{ label }}" class="grid size-12 place-items-center rounded-xl border border-field bg-surface disabled:opacity-40">{% include "ui/components/icon.html" with name="minus" %}</button>
    <input id="{{ id }}" name="{{ name }}" x-ref="input" x-model.number="value" type="number" inputmode="numeric" min="{{ min|default:0 }}" max="{{ max|default:99 }}" value="{{ value|default:0 }}" class="h-12 w-20 rounded-xl border border-field bg-surface text-center text-lg font-semibold tabular-nums">
    <button type="button" @click="step(1)" :disabled="value >= {{ max|default:99 }}" aria-label="More: {{ label }}" class="grid size-12 place-items-center rounded-xl border border-field bg-surface disabled:opacity-40">{% include "ui/components/icon.html" with name="plus" %}</button>
  </div>
</div>
