# The DerbyNet server for a race (#58).  server/docker/README.md says how to
# run it.
#
#   docker compose up -d                      # SQLite on the data volume
#   docker compose --profile postgres up -d   # Postgres in a second container
#
# server/compose.yaml, one folder up, is the developers' side-by-side PHP and
# Django setup; this file is the one a race runs.

name: derbynet

services:
  server:
    image: ${DERBYNET_IMAGE:-ghcr.io/porkchopexpress86/derbynet_server:latest}
    build:
      context: ../..
      dockerfile: server/docker/Dockerfile
    restart: unless-stopped
    ports:
      - "${DERBYNET_HTTP_PORT:-80}:80"
      - "${DERBYNET_HTTPS_PORT:-443}:443"
    environment:
      TZ: ${TZ:-America/New_York}
      # The database the entrypoint uses when the postgres service below is
      # running, as it is under `--profile postgres`.  Otherwise the server
      # keeps SQLite, one file on the data volume in WAL mode.
      DERBYNET_POSTGRES_URL: postgres://derbynet:${POSTGRES_PASSWORD:-derbynet}@postgres:5432/derbynet
    volumes:
      - data:/var/lib/derbynet
    depends_on:
      postgres:
        condition: service_healthy
        # Without the profile there is no postgres service to wait for.
        required: false

  postgres:
    image: postgres:17@sha256:846a7ddaa67a4b354ae1d21087b683901aa6113a4ed626d3787cfbf6c85e3e07
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: derbynet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-derbynet}
      POSTGRES_DB: derbynet
    # No ports: only the server reaches it, on the compose network.
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U derbynet -d derbynet"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  data:
  postgres:
