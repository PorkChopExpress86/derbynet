[project]
name = "derbynet-server"
version = "0.0.0"
description = "The Django port of the DerbyNet server."
requires-python = ">=3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "dj-database-url>=3.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3",
    "pytest>=8.4",
    "pytest-django>=4.11",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "derbynet.settings"
testpaths = ["tests", "core", "roster", "racing", "awards", "kiosks", "accounts", "legacy_api"]
addopts = "--strict-markers"
