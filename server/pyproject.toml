[project]
name = "derbynet-server"
version = "0.0.0"
description = "The Django port of the DerbyNet server."
requires-python = ">=3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "dj-database-url>=3.0",
    "opencv-python-headless>=4.12,<5",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3",
    "hypothesis>=6.170.11",
    "pytest>=8.4",
    "pytest-django>=4.11",
    "pytest-xdist>=3.8",
    "ruff>=0.14",
]
# The WSGI server tools/load-run.sh serves Django with (ADR-08), until M6
# settles the production image. `uv run --group serve` installs it.
serve = [
    "gunicorn>=26.2,<27",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
extend-exclude = ["racing/engine/scheduling/generator_tables.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "derbynet.settings"
testpaths = ["tests", "core", "roster", "racing", "awards", "kiosks", "accounts", "legacy_api", "transfer", "media"]
addopts = "--strict-markers -m 'not full'"
markers = [
    "pr: schedule parity cases run on every pull request",
    "full: the whole schedule parity sweep; run with -m full",
    "golden: replays the PHP golden fixtures (#7); the parity gate runs them",
]
